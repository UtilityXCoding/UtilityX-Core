name: UtilityX-Core
version: '010825'
main: xyz.blackdev.utilityxcore.UtilityXCore
api-version: '1.21'
prefix: UX-Core
load: STARTUP
authors: [ BlackDev, Idiotischer ]
description: UtilityX is a Plugin that is supposed to replace Essentials
website: https://UtilityX.de

commands:
  utilityx:
    description: Opens the UtilityX-Core GUI
    aliases: [ux,uxui,uxgui,uxcoreui,uxcoregui]
  utilityxcore:
    description: Tells you what UtilityX-Core is
    aliases: [uxcore,uxc]
  uxversion:
    description: Shows the version of UtilityX-Core
    aliases: [ utilityxversion, uxv ]
