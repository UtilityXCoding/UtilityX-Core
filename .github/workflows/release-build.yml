name: Release Build

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload (e.g. v1.2.3)"
        required: true
        type: string
      ref:
        description: "Branch, commit, or tag to build from"
        required: false
        default: "main"
        type: string

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build shaded jar
        run: ./gradlew clean shadowJar -Pver=${{ inputs.tag }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            build/libs/*.jar
